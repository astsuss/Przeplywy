name: euler_test
on: push
jobs:
  main: 
    runs-on: ubuntu-latest 
    steps:
      - run: pip install nbformat ipykernel
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - run: quarto render euler.ipynb --execute --to pdf
      - uses: actions/upload-artifact@v7
        with:
          path: raport.pdf
          arcive: false
